server.port=9000
spring.application.name=auth-server

# --- Emisor de los tokens (claim "iss") ---
# Fijo para que los tokens digan lo mismo sin importar desde dónde se pidan.
# En Docker se sobrescribe con AUTH_ISSUER=http://auth-server:9000
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:9000}

# --- Clientes registrados (flujo client_credentials) ---
# {noop}: secreto sin cifrar; aceptable solo en este entorno académico (ver README)

# Aplicación de solo lectura (reportes)
spring.security.oauth2.authorizationserver.client.consulta.registration.client-id=cliente-consulta
spring.security.oauth2.authorizationserver.client.consulta.registration.client-secret={noop}consulta-secret-2026
spring.security.oauth2.authorizationserver.client.consulta.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.consulta.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.consulta.registration.scopes=cuentas.leer,pagos.leer

# Canal que opera dinero (cajero)
spring.security.oauth2.authorizationserver.client.cajero.registration.client-id=cliente-cajero
spring.security.oauth2.authorizationserver.client.cajero.registration.client-secret={noop}cajero-secret-2026
spring.security.oauth2.authorizationserver.client.cajero.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.cajero.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.cajero.registration.scopes=cuentas.leer,cuentas.retirar

# Operaciones (métricas del actuator)
spring.security.oauth2.authorizationserver.client.monitoreo.registration.client-id=cliente-monitoreo
spring.security.oauth2.authorizationserver.client.monitoreo.registration.client-secret={noop}monitoreo-secret-2026
spring.security.oauth2.authorizationserver.client.monitoreo.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.monitoreo.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.monitoreo.registration.scopes=monitoreo

# --- Registro en Eureka ---
# Placeholders con valor local por defecto; el compose entrega los valores de Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}