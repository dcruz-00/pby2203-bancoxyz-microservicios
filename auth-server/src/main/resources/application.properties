server.port=9000
spring.application.name=auth-server

# --- Emisor de los tokens (claim "iss") ---
# Fijo para que los tokens digan lo mismo sin importar desde dónde se pidan.
# En Docker se sobrescribe con AUTH_ISSUER=http://auth-server:9000
spring.security.oauth2.authorizationserver.issuer=${AUTH_ISSUER:http://localhost:9000}

# --- Clientes registrados (flujo client_credentials) ---
# {noop}: secreto sin cifrar; aceptable solo en este entorno académico (ver README).
# Cada cliente recibe solo los scopes que su función requiere (mínimo privilegio).

# ===== Clientes para pruebas directas a los microservicios (Insomnia) =====

# Aplicación de solo lectura (reportes)
spring.security.oauth2.authorizationserver.client.consulta.registration.client-id=cliente-consulta
spring.security.oauth2.authorizationserver.client.consulta.registration.client-secret={noop}consulta-secret-2026
spring.security.oauth2.authorizationserver.client.consulta.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.consulta.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.consulta.registration.scopes=cuentas.leer,pagos.leer,clientes.leer

# Canal que opera dinero (cajero)
spring.security.oauth2.authorizationserver.client.cajero.registration.client-id=cliente-cajero
spring.security.oauth2.authorizationserver.client.cajero.registration.client-secret={noop}cajero-secret-2026
spring.security.oauth2.authorizationserver.client.cajero.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.cajero.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.cajero.registration.scopes=cuentas.leer,cuentas.retirar

# Operaciones (métricas del actuator)
spring.security.oauth2.authorizationserver.client.monitoreo.registration.client-id=cliente-monitoreo
spring.security.oauth2.authorizationserver.client.monitoreo.registration.client-secret={noop}monitoreo-secret-2026
spring.security.oauth2.authorizationserver.client.monitoreo.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.monitoreo.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.monitoreo.registration.scopes=monitoreo

# Ejecutivo del banco: apertura/cierre de cuentas, perfiles de clientes y pagos
spring.security.oauth2.authorizationserver.client.backoffice.registration.client-id=cliente-backoffice
spring.security.oauth2.authorizationserver.client.backoffice.registration.client-secret={noop}backoffice-secret-2026
spring.security.oauth2.authorizationserver.client.backoffice.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.backoffice.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.backoffice.registration.scopes=cuentas.leer,cuentas.administrar,clientes.leer,clientes.escribir,pagos.leer,pagos.operar

# ===== BFF: cada canal tiene sus propias credenciales y scopes =====

# BFF web: datos completos y operaciones de la banca en línea
spring.security.oauth2.authorizationserver.client.bffweb.registration.client-id=bff-web
spring.security.oauth2.authorizationserver.client.bffweb.registration.client-secret={noop}bff-web-secret-2026
spring.security.oauth2.authorizationserver.client.bffweb.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bffweb.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bffweb.registration.scopes=cuentas.leer,cuentas.administrar,clientes.leer,pagos.leer,pagos.operar

# BFF móvil: consultas livianas, pagos y transferencias
spring.security.oauth2.authorizationserver.client.bffmovil.registration.client-id=bff-movil
spring.security.oauth2.authorizationserver.client.bffmovil.registration.client-secret={noop}bff-movil-secret-2026
spring.security.oauth2.authorizationserver.client.bffmovil.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bffmovil.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bffmovil.registration.scopes=cuentas.leer,pagos.leer,pagos.operar

# BFF cajeros: solo consulta de saldo y retiro
spring.security.oauth2.authorizationserver.client.bffcajeros.registration.client-id=bff-cajeros
spring.security.oauth2.authorizationserver.client.bffcajeros.registration.client-secret={noop}bff-cajeros-secret-2026
spring.security.oauth2.authorizationserver.client.bffcajeros.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bffcajeros.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bffcajeros.registration.scopes=cuentas.leer,cuentas.retirar

# ===== Llamadas entre microservicios =====

# pagos -> cuentas: aplicar depósitos, pagos y transferencias
spring.security.oauth2.authorizationserver.client.svcpagos.registration.client-id=svc-pagos
spring.security.oauth2.authorizationserver.client.svcpagos.registration.client-secret={noop}svc-pagos-secret-2026
spring.security.oauth2.authorizationserver.client.svcpagos.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.svcpagos.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.svcpagos.registration.scopes=cuentas.operar

# cuentas -> clientes: validar al titular al abrir una cuenta
spring.security.oauth2.authorizationserver.client.svccuentas.registration.client-id=svc-cuentas
spring.security.oauth2.authorizationserver.client.svccuentas.registration.client-secret={noop}svc-cuentas-secret-2026
spring.security.oauth2.authorizationserver.client.svccuentas.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.svccuentas.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.svccuentas.registration.scopes=clientes.leer

# --- Registro en Eureka ---
# Placeholders con valor local por defecto; el compose entrega los valores de Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}