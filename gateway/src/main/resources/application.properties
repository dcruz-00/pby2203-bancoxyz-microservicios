# Punto de entrada único para los frontends: enruta cada canal a su BFF.
server.port=8443
spring.application.name=gateway

server.ssl.enabled=true
server.ssl.key-store=classpath:bancoxyz-keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# --- Rutas ---
# lb://<servicio>: el gateway consulta Eureka y reparte las solicitudes entre las
# instancias registradas del BFF (balanceo de carga). Las cabeceras (Authorization,
# X-Pin) llegan sin cambios al BFF, que autentica al canal.
spring.cloud.gateway.server.webflux.routes[0].id=bff-web
spring.cloud.gateway.server.webflux.routes[0].uri=lb://bff-web
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/web/**

spring.cloud.gateway.server.webflux.routes[1].id=bff-movil
spring.cloud.gateway.server.webflux.routes[1].uri=lb://bff-movil
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/movil/**

spring.cloud.gateway.server.webflux.routes[2].id=bff-cajeros
spring.cloud.gateway.server.webflux.routes[2].uri=lb://bff-cajeros
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/cajero/**

# --- HTTPS hacia los BFF ---
# Confía solo en el certificado del proyecto (no en cualquier certificado).
spring.cloud.gateway.server.webflux.httpclient.ssl.trusted-x509-certificates[0]=classpath:bancoxyz-cert.pem
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# --- Actuator: health para Docker y la lista de rutas para verificar la configuración ---
management.endpoints.web.exposure.include=health,gateway
management.endpoint.gateway.access=read-only

# --- Registro en Eureka ---
# Placeholders con valor local por defecto; el compose entrega los valores de Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false

spring.cloud.compatibility-verifier.enabled=false
