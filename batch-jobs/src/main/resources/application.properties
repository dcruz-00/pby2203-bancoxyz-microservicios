spring.application.name=batch-jobs

# --- Base de datos propia del Batch (metadatos de Spring Batch + tablas de negocio) ---
# Valores locales por defecto (PostgreSQL de docker-compose publicado en 5436);
# dentro de Docker los entrega el compose con variables de entorno.
spring.datasource.url=${BATCH_DB_URL:jdbc:postgresql://localhost:5436/batch_db}
spring.datasource.username=${BATCH_DB_USER:batch_user}
spring.datasource.password=${BATCH_DB_PASSWORD:batch2026}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# Los jobs los lanza EjecutorDeJobs (con reejecución automática), no Spring Boot
spring.batch.job.enabled=false

# --- Parámetros de los procesos ---
# Carpeta con los CSV del sistema legacy (classpath: o file:). Por defecto, el set de
# mayor volumen del repositorio fin_legacy_data (1000 registros por archivo).
batch.directorio-datos=${BATCH_DATOS:classpath:data/semana_3/}
# Fecha de proceso (AAAA-MM-DD); vacía = hoy. Identifica la ejecución: el mismo
# job con la misma fecha no se procesa dos veces.
batch.fecha-proceso=${BATCH_FECHA_PROCESO:}
# Registros por transacción (chunk)
batch.chunk=${BATCH_CHUNK:100}
# Hilos para los pasos en paralelo y particiones del job de transacciones
batch.hilos=4
batch.particiones=4
# Máximo de registros rechazados por paso; si se supera, el job falla por calidad de datos
batch.limite-rechazos=${BATCH_LIMITE_RECHAZOS:1000}
# Reejecución automática de un job que falla por un error técnico
batch.reintentos-job=3
batch.espera-entre-reintentos=5s
# Demostración: provoca un fallo crítico en el job de intereses en el primer intento
batch.simular-fallo=${BATCH_SIMULAR_FALLO:false}
