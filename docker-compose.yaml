# Orquestación completa de BancoXYZ: infraestructura, plataforma Spring Cloud,
# microservicios, BFF, gateway y procesos batch.
#
# Uso:        docker compose up -d --build
# Escalado:   docker compose -f docker-compose.yaml -f docker-compose.escalado.yaml up -d \
#               --scale cuentas=2 --scale pagos=2 --scale clientes=2
#
# cuentas, pagos y clientes no tienen container_name para poder levantar varias
# réplicas; cada réplica se registra en Eureka y recibe tráfico por balanceo de carga.

x-spring-docker: &spring-docker
  SPRING_PROFILES_ACTIVE: docker
  CONFIG_SERVER_URL: http://config-server:8888

x-depende-de-plataforma: &depende-de-plataforma
  config-server:
    condition: service_healthy
  service-registry:
    condition: service_healthy
  auth-server:
    condition: service_healthy

services:

  # ---------- Infraestructura ----------

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # Acceso desde el equipo (depuración)
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Un solo broker: los tópicos internos no pueden replicarse
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los tópicos se crean explícitamente en kafka-init
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Sin espera inicial al unirse consumidores a un grupo (agiliza las pruebas)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Los tópicos con 3 particiones permiten repartir el consumo entre réplicas
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        $$T --bootstrap-server $$B --create --if-not-exists --topic retiro-realizado       --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic movimiento-registrado  --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic movimiento-fallido     --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic transaccion-completada --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic alerta-seguridad       --partitions 1 --replication-factor 1
        echo "Tópicos listos"

  # Una base de datos por microservicio (y otra para el Batch)
  postgres-cuentas:
    image: postgres:18
    container_name: postgres-cuentas
    ports:
      - "5434:5432"   # 5434 en el equipo para no chocar con el PostgreSQL local
    environment:
      POSTGRES_DB: cuentas_db
      POSTGRES_USER: cuentas_user
      POSTGRES_PASSWORD: cuentas2026
    volumes:
      - cuentas-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentas_user -d cuentas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-pagos:
    image: postgres:18
    container_name: postgres-pagos
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: pagos_db
      POSTGRES_USER: pagos_user
      POSTGRES_PASSWORD: pagos2026
    volumes:
      - pagos-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagos_user -d pagos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-clientes:
    image: postgres:18
    container_name: postgres-clientes
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: clientes_db
      POSTGRES_USER: clientes_user
      POSTGRES_PASSWORD: clientes2026
    volumes:
      - clientes-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientes_user -d clientes_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-batch:
    image: postgres:18
    container_name: postgres-batch
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: batch_db
      POSTGRES_USER: batch_user
      POSTGRES_PASSWORD: batch2026
    volumes:
      - batch-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch_user -d batch_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Plataforma Spring Cloud ----------

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: bancoxyz/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    restart: unless-stopped
    healthcheck:
      # Sano = ya sirve configuración (no solo "proceso iniciado")
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8888/cuentas/default"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    image: bancoxyz/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8761/eureka/apps"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: bancoxyz/auth-server
    container_name: auth-server
    ports:
      - "9000:9000"
    environment:
      AUTH_ISSUER: http://auth-server:9000
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_HOSTNAME: auth-server
    depends_on:
      service-registry:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Metadatos públicos de OAuth: sano = ya puede emitir tokens
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9000/.well-known/oauth-authorization-server"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: bancoxyz/gateway
    container_name: gateway
    ports:
      - "8443:8443"   # Punto de entrada único para los frontends (HTTPS)
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_HOSTNAME: gateway
    depends_on:
      service-registry:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------- Microservicios ----------

  cuentas:
    build:
      context: .
      dockerfile: cuentas/Dockerfile
    image: bancoxyz/cuentas
    ports:
      - "8080:8080"   # Pruebas directas; con réplicas, ver docker-compose.escalado.yaml
    environment: *spring-docker
    depends_on:
      <<: *depende-de-plataforma
      postgres-cuentas:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # -k: certificado autofirmado
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  pagos:
    build:
      context: .
      dockerfile: pagos/Dockerfile
    image: bancoxyz/pagos
    ports:
      - "8081:8081"
    environment: *spring-docker
    depends_on:
      <<: *depende-de-plataforma
      postgres-pagos:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  clientes:
    build:
      context: .
      dockerfile: clientes/Dockerfile
    image: bancoxyz/clientes
    ports:
      - "8084:8084"
    environment: *spring-docker
    depends_on:
      <<: *depende-de-plataforma
      postgres-clientes:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- Backend for Frontend ----------
  # No dependen de los microservicios: arrancan solos y, si un servicio no está,
  # responden 503 o con datos parciales (Circuit Breaker).

  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    image: bancoxyz/bff-web
    container_name: bff-web
    ports:
      - "8091:8091"
    environment: *spring-docker
    depends_on: *depende-de-plataforma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  bff-movil:
    build:
      context: .
      dockerfile: bff-movil/Dockerfile
    image: bancoxyz/bff-movil
    container_name: bff-movil
    ports:
      - "8092:8092"
    environment: *spring-docker
    depends_on: *depende-de-plataforma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8092/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  bff-cajeros:
    build:
      context: .
      dockerfile: bff-cajeros/Dockerfile
    image: bancoxyz/bff-cajeros
    container_name: bff-cajeros
    ports:
      - "8093:8093"
    environment: *spring-docker
    depends_on: *depende-de-plataforma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8093/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ---------- Procesos batch ----------
  # Se ejecuta al levantar el sistema y termina. Si un job falla de forma
  # persistente, sale con código 1 y Docker lo reintenta hasta 3 veces.
  # Ejecución manual: docker compose run --rm batch-jobs

  batch-jobs:
    build:
      context: .
      dockerfile: batch-jobs/Dockerfile
    image: bancoxyz/batch-jobs
    container_name: batch-jobs
    environment:
      BATCH_DB_URL: jdbc:postgresql://postgres-batch:5432/batch_db
      BATCH_DB_USER: batch_user
      BATCH_DB_PASSWORD: batch2026
    depends_on:
      postgres-batch:
        condition: service_healthy
    restart: on-failure:3

volumes:
  cuentas-data:
  pagos-data:
  clientes-data:
  batch-data:
