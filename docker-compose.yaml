# Orquestación completa de BancoXYZ: infraestructura + microservicios.
# Uso: docker compose up -d --build

services:

  # ---------- Infraestructura ----------

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # Acceso desde el equipo (depuración)
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Un solo broker: los tópicos internos no pueden replicarse
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los tópicos se crean explícitamente en kafka-init
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Sin espera inicial al unirse consumidores a un grupo (agiliza las pruebas)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        $$T --bootstrap-server $$B --create --if-not-exists --topic retiro-realizado      --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic movimiento-registrado --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic movimiento-fallido    --partitions 1 --replication-factor 1
        echo "Tópicos listos"

  postgres-core:
    image: postgres:18
    container_name: postgres-core
    ports:
      - "5434:5432"   # 5434 en el equipo para no chocar con el PostgreSQL local
    environment:
      POSTGRES_DB: bancoxyz_core
      POSTGRES_USER: core_user
      POSTGRES_PASSWORD: core2026
    volumes:
      - core-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_user -d bancoxyz_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-movimientos:
    image: postgres:18
    container_name: postgres-movimientos
    ports:
      - "5433:5432"   # 5433 en el equipo para no chocar con el PostgreSQL local
    environment:
      POSTGRES_DB: movimientos_db
      POSTGRES_USER: movimientos_user
      POSTGRES_PASSWORD: movimientos2026
    volumes:
      - movimientos-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movimientos_user -d movimientos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Plataforma Spring Cloud ----------

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: bancoxyz/config-server
    container_name: config-server
    ports:
      - "8888:8888"
    restart: unless-stopped
    healthcheck:
      # Sano = ya sirve configuración (no solo "proceso iniciado")
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8888/core-api/default"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    image: bancoxyz/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:8761/eureka/apps"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: bancoxyz/auth-server
    container_name: auth-server
    ports:
      - "9000:9000"
    environment:
      AUTH_ISSUER: http://auth-server:9000
      EUREKA_URL: http://service-registry:8761/eureka/
      EUREKA_HOSTNAME: auth-server
    depends_on:
      service-registry:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Metadatos públicos de OAuth: sano = ya puede emitir tokens
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:9000/.well-known/oauth-authorization-server"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------- Microservicios ----------

  core-api:
    build:
      context: .
      dockerfile: core-api/Dockerfile
    image: bancoxyz/core-api
    container_name: core-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      postgres-core:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # -k: certificado autofirmado
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  movimientos:
    container_name: movimientos
    ports:
      - "8081:8081"
    build:
      context: .
      dockerfile: movimientos/Dockerfile
    image: bancoxyz/movimientos
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      postgres-movimientos:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  core-data:
  movimientos-data: