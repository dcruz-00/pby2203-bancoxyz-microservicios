# Infraestructura de la S7: Kafka (KRaft) y PostgreSQL de movimientos.
# Uso: docker compose up -d

services:
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # Acceso desde el equipo (core-api, movimientos)
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Un solo broker: los tópicos internos no pueden replicarse
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los tópicos se crean explícitamente en kafka-init
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Sin espera inicial al unirse consumidores a un grupo (agiliza las pruebas)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:29092
        $$T --bootstrap-server $$B --create --if-not-exists --topic retiro-realizado      --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic movimiento-registrado --partitions 1 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic movimiento-fallido    --partitions 1 --replication-factor 1
        echo "Tópicos listos"

  postgres-movimientos:
    image: postgres:18
    container_name: postgres-movimientos
    ports:
      - "5433:5432"   # 5433 en el equipo para no chocar con el PostgreSQL local
    environment:
      POSTGRES_DB: movimientos_db
      POSTGRES_USER: movimientos_user
      POSTGRES_PASSWORD: movimientos2026
    volumes:
      - movimientos-data:/var/lib/postgresql

volumes:
  movimientos-data: