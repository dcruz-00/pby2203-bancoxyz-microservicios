server.port=8888
spring.application.name=config-server

# Modo "native": sirve la configuracion desde una carpeta local del propio
# proyecto (config-repo), en vez de requerir un repositorio Git externo.
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config-repo

# Por si Spring Cloud 2025.1.3 marca a Spring Boot 4.1.0 como no verificado
# (el release train oficial esta pensado para 4.0.8). Si compila y arranca
# bien sin esta linea, se puede quitar.
spring.cloud.compatibility-verifier.enabled=false