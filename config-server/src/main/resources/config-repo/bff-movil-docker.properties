# Perfil "docker": solo sobrescribe lo que cambia dentro de la red de Docker Compose.
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
# El gateway llama al BFF por este nombre y verifica que coincida con el certificado
eureka.instance.hostname=bff-movil
spring.security.oauth2.client.provider.auth.token-uri=http://auth-server:9000/oauth2/token
