# Perfil "docker": solo sobrescribe lo que cambia dentro de la red de Docker Compose.
spring.datasource.url=jdbc:postgresql://postgres-clientes:5432/clientes_db
spring.kafka.bootstrap-servers=kafka:29092
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth-server:9000

# Escalado horizontal: cada réplica se registra con su IP y un id único
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
