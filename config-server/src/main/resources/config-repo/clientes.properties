server.port=8084

# --- Base de datos propia (PostgreSQL en Docker, ver docker-compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5435/clientes_db
spring.datasource.username=clientes_user
spring.datasource.password=clientes2026
spring.flyway.fail-on-missing-locations=true

# --- Pool de conexiones y timeouts (mismos criterios que cuentas) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=5s

server.ssl.enabled=true
server.ssl.key-store=classpath:bancoxyz-keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# --- Kafka: consume transaccion-completada y alerta-seguridad ---
spring.kafka.bootstrap-servers=localhost:9092
# Si clientes arranca después de que se publicaron eventos, los lee igual
spring.kafka.consumer.auto-offset-reset=earliest

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=SCOPE_monitoreo

# --- Registro en Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false

# --- OAuth 2.0: validación de tokens ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
