server.port=8081

# --- Base de datos propia (PostgreSQL en Docker, ver docker-compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/pagos_db
spring.datasource.username=pagos_user
spring.datasource.password=pagos2026
spring.flyway.fail-on-missing-locations=true

# --- Pool de conexiones y timeouts (mismos criterios que cuentas) ---
# Con la base de datos caída, cada intento de conexión falla a los 5 s.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=5s

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092

server.ssl.enabled=true
server.ssl.key-store=classpath:bancoxyz-keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# --- Actuator ---
# health es público (healthchecks de Docker) pero sus detalles solo se muestran
# a clientes con scope "monitoreo"; info y metrics exigen ese scope.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=SCOPE_monitoreo

# --- Registro en Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false

# --- Resilience4j: reintentos al guardar un movimiento ---
# Solo reintenta errores de acceso a datos (conexion caida, timeout);
# un error de integridad (ej. constraint violado) es un error de negocio
# y no se soluciona reintentando, por eso se excluye explicitamente.
resilience4j.retry.instances.guardarMovimiento.max-attempts=3
resilience4j.retry.instances.guardarMovimiento.wait-duration=2s
resilience4j.retry.instances.guardarMovimiento.retry-exceptions[0]=org.springframework.dao.DataAccessException
resilience4j.retry.instances.guardarMovimiento.ignore-exceptions[0]=org.springframework.dao.DataIntegrityViolationException

# --- OAuth 2.0: validación de tokens ---
# Debe coincidir con el claim "iss" que emite auth-server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
# --- OAuth 2.0 como cliente: token propio de pagos para operar en cuentas ---
spring.security.oauth2.client.registration.cuentas.provider=auth
spring.security.oauth2.client.registration.cuentas.client-id=svc-pagos
spring.security.oauth2.client.registration.cuentas.client-secret=svc-pagos-secret-2026
spring.security.oauth2.client.registration.cuentas.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.cuentas.scope=cuentas.operar
spring.security.oauth2.client.provider.auth.token-uri=http://localhost:9000/oauth2/token

# --- Resilience4j: llamada a cuentas (depósitos, pagos y transferencias) ---
# Retry: 3 intentos con espera creciente (500 ms, 1 s). Es seguro reintentar porque
# cuentas reconoce el id de operación y no aplica dos veces la misma operación.
# No se reintenta un rechazo de negocio ni una llamada rechazada por el circuito abierto.
resilience4j.retry.instances.cuentas.max-attempts=3
resilience4j.retry.instances.cuentas.wait-duration=500ms
resilience4j.retry.instances.cuentas.enable-exponential-backoff=true
resilience4j.retry.instances.cuentas.exponential-backoff-multiplier=2
resilience4j.retry.instances.cuentas.ignore-exceptions[0]=com.bancoxyz.pagos.exception.RechazoCuentasException
resilience4j.retry.instances.cuentas.ignore-exceptions[1]=io.github.resilience4j.circuitbreaker.CallNotPermittedException

# Circuit Breaker: con 50 % de fallas en las últimas 6 llamadas (mínimo 4), deja de
# llamar a cuentas durante 20 s y luego prueba con 2 llamadas.
resilience4j.circuitbreaker.instances.cuentas.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.cuentas.sliding-window-size=6
resilience4j.circuitbreaker.instances.cuentas.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.cuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentas.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.cuentas.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.cuentas.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.cuentas.ignore-exceptions[0]=com.bancoxyz.pagos.exception.RechazoCuentasException
