server.port=8093

server.ssl.enabled=true
server.ssl.key-store=classpath:bancoxyz-keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# Errores de validación con el formato estándar ProblemDetail (RFC 9457)
spring.mvc.problemdetails.enabled=true

# --- Usuario del canal (HTTP Basic sobre HTTPS) ---
bff.usuario=cajero-client
bff.clave=cajero-secret

# Monto máximo por retiro en cajero
bff.limite-por-operacion=500
# PIN de la tarjeta (cabecera X-Pin); valor fijo de demostración
atm.pin.esperado=1234

# --- OAuth 2.0 como cliente: token propio del BFF para llamar a los microservicios ---
# Flujo client_credentials; el token se reutiliza hasta que vence (5 min).
spring.security.oauth2.client.registration.bff.provider=auth
spring.security.oauth2.client.registration.bff.client-id=bff-cajeros
spring.security.oauth2.client.registration.bff.client-secret=bff-cajeros-secret-2026
spring.security.oauth2.client.registration.bff.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.bff.scope=cuentas.leer,cuentas.retirar
spring.security.oauth2.client.provider.auth.token-uri=http://localhost:9000/oauth2/token

# --- Actuator: solo health (healthcheck de Docker) ---
management.endpoints.web.exposure.include=health

# --- Registro en Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false
