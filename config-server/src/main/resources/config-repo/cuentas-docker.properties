# Perfil "docker": solo sobrescribe lo que cambia dentro de la red de Docker Compose.
# El resto se hereda de cuentas.properties.
spring.datasource.url=jdbc:postgresql://postgres-cuentas:5432/cuentas_db
spring.kafka.bootstrap-servers=kafka:29092
eureka.client.service-url.defaultZone=http://service-registry:8761/eureka/
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth-server:9000
spring.security.oauth2.client.provider.auth.token-uri=http://auth-server:9000/oauth2/token

# Escalado horizontal: cada réplica se registra en Eureka con su propia IP y un id único,
# para que el balanceo de carga distinga las instancias (todas comparten el nombre "cuentas").
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
