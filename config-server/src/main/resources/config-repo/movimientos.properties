server.port=8081

# --- Base de datos propia (PostgreSQL en Docker, ver compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/movimientos_db
spring.datasource.username=movimientos_user
spring.datasource.password=movimientos2026
spring.flyway.fail-on-missing-locations=true

# --- Pool de conexiones y timeouts (mismos criterios que core-api) ---
# Con la base de datos caída, cada intento de conexión falla a los 5 s.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=5s

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092

internal.api.key=clave-interna-bancoxyz-2026

server.ssl.enabled=true
server.ssl.key-store=classpath:bancoxyz-keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# --- Actuator (protegido por la clave interna) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Registro en Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false

# --- Resilience4j: reintentos al guardar un movimiento ---
# Solo reintenta errores de acceso a datos (conexion caida, timeout);
# un error de integridad (ej. constraint violado) es un error de negocio
# y no se soluciona reintentando, por eso se excluye explicitamente.
resilience4j.retry.instances.guardarMovimiento.max-attempts=3
resilience4j.retry.instances.guardarMovimiento.wait-duration=2s
resilience4j.retry.instances.guardarMovimiento.retry-exceptions[0]=org.springframework.dao.DataAccessException
resilience4j.retry.instances.guardarMovimiento.ignore-exceptions[0]=org.springframework.dao.DataIntegrityViolationException