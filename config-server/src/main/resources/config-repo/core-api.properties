server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/bancoxyz_core
spring.datasource.username=core_user
spring.datasource.password=core2026

spring.flyway.fail-on-missing-locations=true

server.ssl.enabled=true
server.ssl.key-store=classpath:bancoxyz-keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# --- Pool de conexiones (HikariCP) ---
# 10 conexiones es el valor por defecto de Hikari; se deja explícito para documentarlo.
# PostgreSQL admite 100 conexiones por defecto: con N instancias de core-api, el total es N x 10.
spring.datasource.hikari.maximum-pool-size=10
# Si el pool está agotado o la base de datos no responde, falla a los 5 s en vez de los 30 s por defecto.
# Así, bajo carga o caída de la BD, las solicitudes fallan rápido en lugar de acumularse esperando.
spring.datasource.hikari.connection-timeout=5000

# --- Timeout de consultas ---
# Una consulta lenta no retiene una conexión del pool más de 5 s.
spring.jdbc.template.query-timeout=5s

# --- Actuator ---
# health es público (healthchecks de Docker) pero sus detalles (BD, disco, etc.)
# solo se muestran a clientes con scope "monitoreo"; info y metrics exigen ese scope.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=SCOPE_monitoreo

# --- Registro en Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
# core-api solo atiende por HTTPS: se registra el puerto seguro y se desactiva el no seguro
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=core-api
# Si core-api arranca después de que movimientos haya respondido, lee igual esas respuestas
spring.kafka.consumer.auto-offset-reset=earliest

# --- OAuth 2.0: validación de tokens ---
# Debe coincidir con el claim "iss" que emite auth-server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000

# --- Kafka: tiempos máximos del productor ---
# Por defecto el productor puede bloquear hasta 60 s esperando al broker; se acotan
# para que cada intento de publicación falle rápido y el Retry pueda actuar.
# Restricción de Kafka: delivery.timeout.ms >= linger.ms + request.timeout.ms
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=3000

# --- Resilience4j: Retry de la publicación de retiro-realizado ---
resilience4j.retry.instances.publicarRetiro.max-attempts=3
resilience4j.retry.instances.publicarRetiro.wait-duration=500ms
resilience4j.retry.instances.publicarRetiro.retry-exceptions[0]=com.bancoxyz.coreapi.exception.PublicacionEventoException

# --- Resilience4j: Circuit Breaker del retiro ---
# Solo cuentan como falla los problemas de publicación; saldo insuficiente o
# cuenta inexistente son respuestas de negocio válidas, no síntomas de caída.
resilience4j.circuitbreaker.instances.retiro.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.retiro.sliding-window-size=4
resilience4j.circuitbreaker.instances.retiro.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.retiro.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.retiro.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.retiro.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.retiro.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.retiro.record-exceptions[0]=com.bancoxyz.coreapi.exception.PublicacionEventoException