server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/bancoxyz_core
spring.datasource.username=core_user
spring.datasource.password=core2026
internal.api.key=clave-interna-bancoxyz-2026

spring.flyway.fail-on-missing-locations=true

server.ssl.enabled=true
server.ssl.key-store=classpath:bancoxyz-keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# --- Pool de conexiones (HikariCP) ---
# 10 conexiones es el valor por defecto de Hikari; se deja explícito para documentarlo.
# PostgreSQL admite 100 conexiones por defecto: con N instancias de core-api, el total es N x 10.
spring.datasource.hikari.maximum-pool-size=10
# Si el pool está agotado o la base de datos no responde, falla a los 5 s en vez de los 30 s por defecto.
# Así, bajo carga o caída de la BD, las solicitudes fallan rápido en lugar de acumularse esperando.
spring.datasource.hikari.connection-timeout=5000

# --- Timeout de consultas ---
# Una consulta lenta no retiene una conexión del pool más de 5 s.
spring.jdbc.template.query-timeout=5s

# --- Actuator ---
# Protegido por el mismo filtro de clave interna que el resto de core-api (X-Internal-Key).
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Registro en Eureka ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
# core-api solo atiende por HTTPS: se registra el puerto seguro y se desactiva el no seguro
eureka.instance.secure-port-enabled=true
eureka.instance.non-secure-port-enabled=false